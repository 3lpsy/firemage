[package]
name = "firemage-oci"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
reqwest = { workspace = true, features = ["rustls-tls-native-roots"] }
url.workspace = true
sha2.workspace = true
hex.workspace = true
tempfile.workspace = true
libc.workspace = true
rustix = { version = "1.1", features = ["fs", "process"] }
oci-spec = { version = "0.10", default-features = false, features = ["distribution", "image"] }
tar = "0.4.46"
flate2 = "1"
zstd = "0.13"
http-auth = { version = "0.1", default-features = false }

[dev-dependencies]
futures-util = "0.3"
axum.workspace = true
rcgen = "0.14"
tokio-rustls = "0.26"
